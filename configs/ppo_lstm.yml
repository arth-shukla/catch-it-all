seed: 0

algo:
  name: ppo_lstm

  rollout_steps: 24
  total_timesteps: 10_000_000_000

  policy:
    init_noise_std: 0.8
    actor_hidden_dims: [256, 256, 256]
    critic_hidden_dims: [256, 256, 256]
    activation: elu

    rnn_hidden_size: 256
    rnn_num_layers: 1
    rnn_type: lstm

  algorithm:
    learning_rate: 0.001
    schedule: adaptive
    desired_kl: 0.01

    gamma: 0.99
    lam: 0.95

    num_learning_epochs: 5
    num_mini_batches: 4

    max_grad_norm: 1.0
    use_clipped_value_loss: true
    
    entropy_coef: 0.01
    clip_param: 0.2
    value_loss_coef: 1.0

  frequency:
    log_freq: 1_000_000
    save_freq: 1_000_000
    save_backup_ckpts: false

logger:
  workspace: humanoid_exps
  exp_name: ppo-lstm
  clear_out: True
  
  tensorboard: True
  wandb: False
  neptune: False
